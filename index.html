<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecico | IT Asset Tracking System</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #004b87;       
      --primary-hover: #003663;
      --card-bg: rgba(255, 255, 255, 0.92); /* خلفية بيضاء شبه شفافة للبطاقات لتوضيح الكلام الأسود */
      --text: #000000;          /* لون النص أسود بالكامل كما طلبت */
      --text-muted: #222222;    /* رمادي غامق جداً للنصوص الفرعية */
      --border: #cbd5e1;
      --success: #059669;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px;
      position: relative;
      overflow-x: hidden;

      /* إعدادات الصورة لتملأ الشاشة بوضوح تام */
      background-image: url('logo.png.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
    }

    /* طبقة تظليل خفيفة جداً فوق الصورة بأكملها (اختيارية، لتقليل سطوع الشاشة فقط) */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.3); /* تبييض خفيف بنسبة 30% فقط لترك اللوجو واضح */
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    /* رأس الصفحة والشعار */
    .brand-header {
      text-align: center;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.85); /* خلفية بسيطة للعنوان ليكون مقروءاً */
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .brand-badge {
      display: inline-block;
      background: #e0f2fe;
      color: var(--primary);
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .brand-header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #000000; /* العنوان أسود */
      letter-spacing: -0.5px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 700;
      margin-top: 6px;
    }

    /* بطاقات المحتوى */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15); /* ظل لتمييز البطاقة عن الخلفية */
      padding: 24px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1.05rem;
      outline: none;
      font-weight: 800;
      color: #000000; /* لون الكتابة داخل المربع أسود */
      transition: all 0.2s ease;
      background: #fff;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 75, 135, 0.1);
    }

    button.btn-search {
      padding: 14px 28px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.btn-search:hover {
      background-color: var(--primary-hover);
    }

    /* مؤشر الاتصال بالبيانات */
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 14px;
      font-weight: 700;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .dot.active {
      background: var(--success);
    }

    /* بطاقة النتيجة */
    .result-card {
      display: none;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .result-id-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text-muted);
    }

    .result-id {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }

    .badge-verified {
      background: #d1fae5;
      color: #047857;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #a7f3d0;
    }

    /* حقول البيانات */
    .fields-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background-color: rgba(248, 250, 252, 0.9);
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    .field-label {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .field-value {
      font-weight: 800;
      color: #000000; /* البيانات تظهر باللون الأسود الواضح */
      font-size: 1.05rem;
      max-width: 60%;
      text-align: right;
      word-break: break-word;
    }

    /* صندوق التنبيه */
    .alert-box {
      display: none;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      font-size: 1rem;
      background: #fef2f2;
      color: #b91c1c;
      border: 2px solid #fca5a5;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="brand-header">
    <div class="brand-badge">Information Systems Department</div>
    <h1>Asset Tracking System</h1>
    <p>Scan QR code or enter hardware tag to retrieve specifications</p>
  </div>

  <div class="card">
    <div class="search-box">
      <input 
        type="text" 
        id="qrInput" 
        placeholder="Enter Asset Tag / Serial No..." 
        autocomplete="off"
        autofocus
      />
      <button class="btn-search" onclick="searchAsset()">Search</button>
    </div>
    
    <div class="status-indicator">
      <span class="dot" id="sheetStatus"></span>
      <span id="sheetStatusText">Connecting to inventory database...</span>
    </div>
  </div>

  <div class="alert-box" id="errorBox">
    No matching asset found. Please verify the tag number.
  </div>

  <div class="card result-card" id="resultCard">
    <div class="result-header">
      <div>
        <div class="result-id-label">Asset Identifier</div>
        <div class="result-id" id="displayId">--</div>
      </div>
      <span class="badge-verified">Verified Record</span>
    </div>

    <div class="fields-list" id="assetDetails">
      <!-- ستظهر البيانات هنا تلقائياً -->
    </div>
  </div>

</div>

<script>
  // لا تنسَ إضافة الرابط الخاص بشيت جوجل مكان هذه الجملة
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRSgHzJf3Hf9VryXLWbip92e9mfMkf1qv_ynff4sOR5-43REdRSOPq_VW5MZyT_9CaOKdZVoMwS39P/pub?output=csv";

  let inventoryData = [];

  async function fetchSheetData() {
    const dot = document.getElementById("sheetStatus");
    const text = document.getElementById("sheetStatusText");
    try {
      const res = await fetch(SHEET_CSV_URL);
      if (!res.ok) throw new Error("Network response error");
      const rawText = await res.text();
      
      parseCSV(rawText);
      
      dot.classList.add("active");
      text.innerText = "System online and synced with Google Sheets";

      const urlParams = new URLSearchParams(window.location.search);
      const queryId = urlParams.get('id') || urlParams.get('code');
      if (queryId) {
        document.getElementById("qrInput").value = queryId;
        searchAsset();
      }
    } catch (err) {
      console.error(err);
      dot.style.background = "#ef4444";
      text.innerText = "Failed to sync database. Check CSV permissions.";
    }
  }

  function parseCSV(text) {
    const rows = text.split("\n").filter(r => r.trim() !== "");
    if (rows.length < 2) return;

    const headers = rows[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
    
    inventoryData = rows.slice(1).map(row => {
      const values = row.split(",").map(v => v.trim().replace(/^"|"$/g, ''));
      let record = {};
      headers.forEach((header, index) => {
        record[header] = values[index] || "—";
      });
      return record;
    });
  }

  function searchAsset() {
    const query = document.getElementById("qrInput").value.trim().toLowerCase();
    const resultCard = document.getElementById("resultCard");
    const errorBox = document.getElementById("errorBox");
    const assetDetails = document.getElementById("assetDetails");
    const displayId = document.getElementById("displayId");

    resultCard.style.display = "none";
    errorBox.style.display = "none";

    if (!query) return;

    const matched = inventoryData.find(item => 
      Object.values(item).some(val => val.toString().trim().toLowerCase() === query)
    );

    if (matched) {
      displayId.innerText = query.toUpperCase();
      assetDetails.innerHTML = "";

      for (const [key, value] of Object.entries(matched)) {
        assetDetails.innerHTML += `
          <div class="field-row">
            <span class="field-label">${key}</span>
            <span class="field-value">${value}</span>
          </div>
        `;
      }
      resultCard.style.display = "block";
    } else {
      errorBox.style.display = "block";
    }
  }

  document.getElementById("qrInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") searchAsset();
  });

  fetchSheetData();
</script>

</body>
</html>
